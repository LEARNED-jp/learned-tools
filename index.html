<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools | LEARNED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans JP',sans-serif;color:#1a1a1a;background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased}
.container{max-width:720px;margin:0 auto;padding:0 32px}
header{background:linear-gradient(160deg,#0a0a0a,#1a1a2e);color:#fff;padding:64px 0 48px}
header h1{font-size:28px;font-weight:700;margin-bottom:8px}
header p{font-size:14px;color:rgba(255,255,255,0.5)}
main{padding:48px 0 80px}
h2{font-size:18px;font-weight:600;margin-bottom:20px}
.tool-card{display:block;padding:20px 24px;border:1px solid #e8eaed;border-radius:12px;text-decoration:none;color:inherit;transition:0.2s;margin-bottom:12px}
.tool-card:hover{border-color:#d0d5dd;background:#f8f9fa}
.tool-card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.tool-card p{font-size:13px;color:#5f6368}
</style>
</head>
<body>
<header><div class="container">
  <h1>Tools</h1>
  <p>LEARNED</p>
</div></header>
<main><div class="container">
  <h2>ツール一覧</h2>
  <a class="tool-card" href="/fontplus-checker/">
    <h3>FONTPLUS フォント使用プロジェクト検索</h3>
    <p>Studioの全プロジェクトからFONTPLUSフォントを使っているものを特定し、代替フォント候補を表示します。</p>
  </a>
</div></main>
</body>
</html>
